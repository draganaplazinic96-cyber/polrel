<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Plan učenja — checklist</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#181b22;
    --border:#2a2f3a;
    --accent:#6ee7b7;
    --accent-dim:#2f6f5a;
    --text:#e7e9ee;
    --muted:#8a90a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
  }
  .overall{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:12px;
    z-index:5;
  }
  .overall .num{
    font-size:22px;
    font-weight:700;
    color:var(--accent);
  }
  .block{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
  }
  .block-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
    flex-wrap:wrap;
    gap:6px;
  }
  .block-title{
    font-weight:600;
    font-size:15px;
  }
  .block-time{
    font-size:12px;
    color:var(--accent);
    font-weight:600;
    background:rgba(110,231,183,0.08);
    padding:3px 10px;
    border-radius:999px;
    border:1px solid var(--accent-dim);
    white-space:nowrap;
  }
  .block-progress{
    font-size:12px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .bar{
    height:5px;
    background:#242833;
    border-radius:3px;
    overflow:hidden;
    margin-bottom:12px;
  }
  .bar-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .2s ease;
  }

  /* number grid (used for question ranges) */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(46px,1fr));
    gap:6px;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:center;
    height:38px;
    border-radius:8px;
    background:#1f232c;
    border:1px solid var(--border);
    cursor:pointer;
    font-size:13px;
    user-select:none;
    transition:background .12s, border-color .12s, color .12s;
  }
  .item:hover{
    border-color:var(--accent-dim);
  }
  .item.checked{
    background:var(--accent);
    color:#0f1115;
    font-weight:700;
    border-color:var(--accent);
    text-decoration:line-through;
  }

  /* named list (used for texts / topics) */
  .list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    height:auto;
    min-height:42px;
    border-radius:8px;
    background:#1f232c;
    border:1px solid var(--border);
    cursor:pointer;
    font-size:13.5px;
    user-select:none;
    padding:8px 12px;
    transition:background .12s, border-color .12s, color .12s;
  }
  .row:hover{
    border-color:var(--accent-dim);
  }
  .row .row-label{
    flex:1;
  }
  .row .row-time{
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
    flex-shrink:0;
  }
  .row.checked{
    background:var(--accent);
    color:#0f1115;
    border-color:var(--accent);
  }
  .row.checked .row-label{
    text-decoration:line-through;
    font-weight:600;
  }
  .row.checked .row-time{
    color:#1f3d33;
  }

  .microbreak{
    display:flex;
    align-items:center;
    gap:8px;
    margin:2px 0 2px 10px;
    color:var(--muted);
    font-size:11px;
    cursor:pointer;
  }
  .microbreak::before{
    content:"↳";
    color:var(--border);
  }
  .microbreak span{
    background:rgba(255,255,255,0.03);
    border:1px dashed var(--border);
    padding:2px 9px;
    border-radius:999px;
    transition:background .12s, border-color .12s, color .12s;
  }
  .microbreak:hover span{
    border-color:var(--accent-dim);
  }
  .microbreak.checked span{
    background:var(--accent);
    color:#0f1115;
    border:1px solid var(--accent);
    font-weight:700;
    text-decoration:line-through;
  }

  .pause{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0 14px;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
  }
  .pause::before, .pause::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
  }
  .pause span{
    white-space:nowrap;
    background:rgba(255,255,255,0.03);
    border:1px dashed var(--border);
    padding:3px 10px;
    border-radius:999px;
    transition:background .12s, border-color .12s, color .12s;
  }
  .pause:hover span{
    border-color:var(--accent-dim);
  }
  .pause.checked span{
    background:var(--accent);
    color:#0f1115;
    border:1px solid var(--accent);
    font-weight:700;
    text-decoration:line-through;
  }
  .pause.provera span{
    border-style:solid;
    border-color:var(--accent-dim);
  }

  .reset-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:6px 12px;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
  }
  .reset-btn:hover{
    border-color:#c0392b;
    color:#e07a6f;
  }
</style>
</head>
<body>

<h1>Plan učenja — Politikologija religije</h1>
<div class="sub">25.8. 15:00 → 26.8. 06:00 · klikni da označiš završeno</div>

<div class="overall">
  <div>
    <div style="font-size:12px;color:var(--muted);">Ukupan napredak</div>
    <div class="num" id="overallCount">0 / 0</div>
  </div>
  <button class="reset-btn" onclick="resetAll()">Resetuj sve</button>
</div>

<div id="blocks"></div>

<script>
// Each block is either:
//  type "items": named entries, each with its own time label. canPause: insert 5-min microbreak after each item.
//  type "range": numeric grid from -> to (question numbers).
// After each block: optional "provera" chip and a "pauza" chip, each with its own time label.

const blocks = [
  {
    title: "Blok 1 — Rider: tekstovi sa spiska",
    time: "15:00–20:24 · 5h 24min",
    type: "items",
    microbreak: "5 min",
    items: [
      { label: "Tokvil — politikologija religije (Jevtić)", time: "15 min" },
      { label: "Berger — teza o sekularizaciji", time: "8 min" },
      { label: "Kazanova — sekularno i sekularizmi", time: "16 min" },
      { label: "Hantington — Treći talas (uvod + religijske promene)", time: "37 min" },
      { label: "Hantington — sukob civilizacija", time: "24 min" },
      { label: "Stepan — uzajamna tolerancija", time: "25 min" },
      { label: "Stepan & Linc — arapsko proleće", time: "18 min" },
      { label: "Filpot — politička ambivalentnost religije", time: "27 min" },
      { label: "Fiš — islam i autoritarizam", time: "42 min" },
      { label: "Foks — demokratije i odvajanje religije od države", time: "30 min" },
      { label: "Prodromou — ambivalentnost pravoslavlja", time: "14 min" },
      { label: "Elštajn — religija i demokratija", time: "13 min" }
    ],
    after: [
      { kind: "provera", label: "brza provera", time: "10 min" },
      { kind: "pauza", label: "pauza", time: "10 min" }
    ]
  },
  {
    title: "Blok 2 — Rider teme samo iz skripte",
    time: "20:34–21:34 · 50 min",
    type: "items",
    items: [
      { label: "Hrišćanski cionizam kao činilac politike SAD (Jevtić)", time: "" },
      { label: "Islam u Kini (Jevtić)", time: "" },
      { label: "Multikulturno društvo i religija (Jevtić)", time: "" },
      { label: "Komeito partija i politički život Japana (Jevtić)", time: "" },
      { label: "Politička korektnost, terorizam i religija (Jevtić)", time: "" },
      { label: "Religija, država i demokratija (Drisen)", time: "" },
      { label: "Hrišćanstvo i demokratija (Berger)", time: "" }
    ],
    after: [
      { kind: "provera", label: "brza provera", time: "8 min" },
      { kind: "pauza", label: "pauza", time: "10 min" }
    ]
  },
  {
    title: "Blok 3 — Pitanja 1–18 iz skripte",
    time: "21:42–22:27 · 35 min",
    type: "range",
    from: 1, to: 18,
    after: [
      { kind: "provera", label: "brza provera", time: "8 min" },
      { kind: "pauza", label: "pauza", time: "10 min" }
    ]
  },
  {
    title: "Blok 4 — Pitanja 69–95 iz skripte",
    time: "22:45–01:15 · 2h 30min",
    type: "range",
    from: 69, to: 95,
    after: [
      { kind: "provera", label: "brza provera", time: "10 min" },
      { kind: "pauza", label: "pauza", time: "10 min" }
    ]
  },
  {
    title: "Blok 5 — Prelazak SKRIPTA SKRIPTE (kondenzovano)",
    time: "01:35–02:15 · 40 min",
    type: "items",
    items: [
      { label: "Pitanja 1–18 (kondenzovano)", time: "" },
      { label: "Pitanja 69–95 (kondenzovano)", time: "" },
      { label: "Pitanja 96–114 (kondenzovano)", time: "" }
    ],
    after: [
      { kind: "provera", label: "brza provera", time: "8 min" },
      { kind: "pauza", label: "pauza", time: "10 min" }
    ]
  },
  {
    title: "Blok 6 — DODATAK (odgovori za usmeni)",
    time: "02:33–03:13 · 40 min",
    type: "range",
    from: 1, to: 55,
    after: [
      { kind: "provera", label: "brza provera", time: "8 min" },
      { kind: "pauza", label: "pauza", time: "10 min" }
    ]
  },
  {
    title: "Finalni pregled — sve u kratkim crtama",
    time: "03:21–05:31 · 2h",
    type: "items",
    items: [
      { label: "Rider spisak — brzi refresh teza", time: "" },
      { label: "1–18 i 69–95 — brzi refresh", time: "" },
      { label: "96–114 — brzi refresh", time: "" },
      { label: "DODATAK — brzi refresh", time: "" }
    ],
    after: [
      { kind: "pauza", label: "rezerva do 06:00", time: "29 min" }
    ]
  }
];

let state = {};

function totalCheckable(){
  let total = 0;
  blocks.forEach((b, bi) => {
    if(b.type === "range"){
      total += (b.to - b.from + 1);
    } else {
      total += b.items.length;
      if(b.microbreak) total += Math.max(0, b.items.length - 1);
    }
    if(b.after) total += b.after.length;
  });
  return total;
}

function render(){
  const container = document.getElementById('blocks');
  container.innerHTML = '';

  blocks.forEach((b, bi) => {
    const blockEl = document.createElement('div');
    blockEl.className = 'block';

    let checkedCount = 0;
    let denom = 0;

    if(b.type === "range"){
      denom = b.to - b.from + 1;
      for(let n = b.from; n <= b.to; n++){
        if(state[`b${bi}-n${n}`]) checkedCount++;
      }
    } else {
      denom = b.items.length;
      b.items.forEach((_, ii) => { if(state[`b${bi}-i${ii}`]) checkedCount++; });
    }

    const pct = denom ? Math.round((checkedCount / denom) * 100) : 0;

    blockEl.innerHTML = `
      <div class="block-head">
        <div class="block-title">${b.title}</div>
        <div class="block-time">${b.time}</div>
      </div>
      <div class="block-progress">${checkedCount} / ${denom} završeno</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    `;

    if(b.type === "range"){
      const grid = document.createElement('div');
      grid.className = 'grid';
      for(let n = b.from; n <= b.to; n++){
        const key = `b${bi}-n${n}`;
        const item = document.createElement('div');
        item.className = 'item' + (state[key] ? ' checked' : '');
        item.textContent = n;
        item.onclick = () => { state[key] = !state[key]; render(); };
        grid.appendChild(item);
      }
      blockEl.appendChild(grid);
    } else {
      const list = document.createElement('div');
      list.className = 'list';
      b.items.forEach((it, ii) => {
        const key = `b${bi}-i${ii}`;
        const row = document.createElement('div');
        row.className = 'row' + (state[key] ? ' checked' : '');
        row.innerHTML = `<span class="row-label">${it.label}</span>` +
          (it.time ? `<span class="row-time">${it.time}</span>` : '');
        row.onclick = () => { state[key] = !state[key]; render(); };
        list.appendChild(row);

        if(b.microbreak && ii < b.items.length - 1){
          const mbKey = `b${bi}-mb${ii}`;
          const mb = document.createElement('div');
          mb.className = 'microbreak' + (state[mbKey] ? ' checked' : '');
          mb.innerHTML = `<span>pauza ${b.microbreak}</span>`;
          mb.onclick = () => { state[mbKey] = !state[mbKey]; render(); };
          list.appendChild(mb);
        }
      });
      blockEl.appendChild(list);
    }

    container.appendChild(blockEl);

    if(b.after){
      b.after.forEach((a, ai) => {
        const key = `b${bi}-after${ai}`;
        const pause = document.createElement('div');
        pause.className = 'pause' + (a.kind === 'provera' ? ' provera' : '') + (state[key] ? ' checked' : '');
        pause.innerHTML = `<span>${a.label}${a.time ? ' · ' + a.time : ''}</span>`;
        pause.onclick = () => { state[key] = !state[key]; render(); };
        container.appendChild(pause);
      });
    }
  });

  const totalChecked = Object.values(state).filter(Boolean).length;
  document.getElementById('overallCount').textContent = `${totalChecked} / ${totalCheckable()}`;
}

function resetAll(){
  state = {};
  render();
}

render();
</script>

</body>
</html>
