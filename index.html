<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Plan učenja — checklist</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#181b22;
    --border:#2a2f3a;
    --accent:#6ee7b7;
    --accent-dim:#2f6f5a;
    --text:#e7e9ee;
    --muted:#8a90a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }
  .overall{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:20px; display:flex; justify-content:space-between;
    align-items:center; position:sticky; top:12px; z-index:5;
  }
  .overall .num{ font-size:22px; font-weight:700; color:var(--accent); }
  .block{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .block-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:6px; }
  .block-title{ font-weight:600; font-size:15px; }
  .block-time{
    font-size:12px; color:var(--accent); font-weight:600; background:rgba(110,231,183,0.08);
    padding:3px 10px; border-radius:999px; border:1px solid var(--accent-dim); white-space:nowrap;
  }
  .block-progress{ font-size:12px; color:var(--muted); margin-bottom:10px; }
  .bar{ height:5px; background:#242833; border-radius:3px; overflow:hidden; margin-bottom:12px; }
  .bar-fill{ height:100%; background:var(--accent); width:0%; transition:width .2s ease; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:6px; }
  .item{
    display:flex; align-items:center; justify-content:center; height:38px; border-radius:8px;
    background:#1f232c; border:1px solid var(--border); cursor:pointer; font-size:13px;
    user-select:none; transition:background .12s, border-color .12s, color .12s;
  }
  .item:hover{ border-color:var(--accent-dim); }
  .item.checked{ background:var(--accent); color:#0f1115; font-weight:700; border-color:var(--accent); text-decoration:line-through; }
  .list{ display:flex; flex-direction:column; gap:6px; }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; height:auto; min-height:42px;
    border-radius:8px; background:#1f232c; border:1px solid var(--border); cursor:pointer; font-size:13.5px;
    user-select:none; padding:8px 12px; transition:background .12s, border-color .12s, color .12s;
  }
  .row:hover{ border-color:var(--accent-dim); }
  .row .row-label{ flex:1; }
  .row .row-time{ font-size:11px; color:var(--muted); white-space:nowrap; flex-shrink:0; }
  .row.checked{ background:var(--accent); color:#0f1115; border-color:var(--accent); }
  .row.checked .row-label{ text-decoration:line-through; font-weight:600; }
  .row.checked .row-time{ color:#1f3d33; }
  .microbreak{ display:flex; align-items:center; gap:8px; margin:2px 0 2px 10px; color:var(--muted); font-size:11px; cursor:pointer; }
  .microbreak::before{ content:"↳"; color:var(--border); }
  .microbreak span{ background:rgba(255,255,255,0.03); border:1px dashed var(--border); padding:2px 9px; border-radius:999px; transition:background .12s, border-color .12s, color .12s; }
  .microbreak:hover span{ border-color:var(--accent-dim); }
  .microbreak.checked span{ background:var(--accent); color:#0f1115; border:1px solid var(--accent); font-weight:700; text-decoration:line-through; }
  .pause{ display:flex; align-items:center; gap:10px; margin:10px 0 14px; color:var(--muted); font-size:12px; cursor:pointer; }
  .pause::before, .pause::after{ content:""; flex:1; height:1px; background:var(--border); }
  .pause span{ white-space:nowrap; background:rgba(255,255,255,0.03); border:1px dashed var(--border); padding:3px 10px; border-radius:999px; transition:background .12s, border-color .12s, color .12s; }
  .pause:hover span{ border-color:var(--accent-dim); }
  .pause.checked span{ background:var(--accent); color:#0f1115; border:1px solid var(--accent); font-weight:700; text-decoration:line-through; }
  .pause.provera span{ border-style:solid; border-color:var(--accent-dim); }
  .countdown{
    background:var(--card); border:1px solid var(--accent-dim); border-radius:12px;
    padding:18px 16px; margin-bottom:16px; text-align:center;
  }
  .countdown .label{ font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em; }
  .countdown .time{ font-size:38px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:0.02em; }
  .countdown .time.warn{ color:#e07a6f; }
  .status-line{ font-size:13px; margin-top:8px; color:var(--muted); }
  .status-line .ontime{ color:var(--accent); font-weight:700; }
  .status-line .late{ color:#e07a6f; font-weight:700; }
  .status-line .early{ color:#6ee7b7; font-weight:700; }
  .actual-row{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .actual-row input[type="time"]{
    background:#1f232c; border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:4px 8px; font-size:12px; font-family:inherit;
  }
  .actual-row input[type="time"]:focus{ outline:none; border-color:var(--accent-dim); }
  .diff-badge{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .diff-badge.late{ background:rgba(224,122,111,0.12); color:#e07a6f; }
  .diff-badge.early{ background:rgba(110,231,183,0.12); color:var(--accent); }
  .diff-badge.ontime{ background:rgba(110,231,183,0.12); color:var(--accent); }
  .item-actual-row{ display:flex; align-items:center; gap:6px; margin:2px 0 6px 12px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .item-actual-row input[type="number"]{
    background:#1f232c; border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:3px 6px; font-size:11px; width:56px; font-family:inherit;
  }
  .item-actual-row input[type="number"]:focus{ outline:none; border-color:var(--accent-dim); }
  .pause-actual-row{ display:flex; align-items:center; justify-content:center; gap:6px; margin:-8px 0 12px; font-size:11px; color:var(--muted); }
  .pause-actual-row input[type="number"]{
    background:#1f232c; border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:3px 6px; font-size:11px; width:56px; font-family:inherit;
  }
  .pause-actual-row input[type="number"]:focus{ outline:none; border-color:var(--accent-dim); }
  .reset-btn{ background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; }
  .reset-btn:hover{ border-color:#c0392b; color:#e07a6f; }
</style>
</head>
<body>

<h1>Plan učenja — Politikologija religije</h1>
<div class="sub">25.8. 20:00 → 26.8. 09:00 · klikni da označiš završeno</div>

<div class="countdown">
  <div class="label">Do ispita (09:00)</div>
  <div class="time" id="countdownDisplay">13:00:00</div>
  <div class="status-line" id="statusLine"></div>
</div>


<div class="overall">
  <div>
    <div style="font-size:12px;color:var(--muted);">Ukupan napredak</div>
    <div class="num" id="overallCount">0 / 0</div>
  </div>
  <button class="reset-btn" onclick="resetAll()">Resetuj sve</button>
</div>

<div id="blocks"></div>

<script>
const blocks = [
  {
    title: "Blok 1 — Rider 6 tekstova",
    time: "20:00–01:01 · 5h 01min (4h36 čitanje + 25min mikropauze)",
    endTime: "01:01",
    type: "items",
    microbreak: "5 min",
    items: [
      { label: "Tokvil — politikologija religije (Jevtić)", time: "30 min · rider 15 str" },
      { label: "Berger — teza o sekularizaciji", time: "16 min · rider 5 str" },
      { label: "Kazanova — sekularno i sekularizmi", time: "32 min · rider 18 str" },
      { label: "Filpot — politička ambivalentnost religije", time: "54 min · rider 21 str" },
      { label: "Fiš — islam i autoritarizam", time: "84 min · rider 34 str" },
      { label: "Foks — demokratije i odvajanje religije od države", time: "60 min · rider 25 str" }
    ],
    after: [
      { kind: "pauza", label: "pauza", time: "9 min · 01:01–01:10" }
    ]
  },
  {
    title: "Blok 2 — Skripta 13 tekstova",
    time: "01:10–02:31 · 1h 21min",
    endTime: "02:31",
    type: "items",
    items: [
      { label: "Hrišćanski cionizam kao činilac politike SAD (Jevtić)", time: "8 min · rider 17 str / skripta 6 str" },
      { label: "Islam u Kini (Jevtić)", time: "5 min · rider 12 str / skripta 4 str" },
      { label: "Multikulturno društvo i religija (Jevtić)", time: "8 min · rider 16 str / skripta 7 str" },
      { label: "Komeito partija i politički život Japana (Jevtić)", time: "6 min · rider 16 str / skripta 5 str" },
      { label: "Politička korektnost, terorizam i religija (Jevtić)", time: "5 min · skripta 4 str" },
      { label: "Hantington — Treći talas", time: "3 min · skripta 2 str" },
      { label: "Hantington — sukob civilizacija", time: "7 min · rider 28 str / skripta 6 str" },
      { label: "Stepan — uzajamna tolerancija", time: "8 min · rider 21 str / skripta 7 str" },
      { label: "Stepan & Linc — arapsko proleće", time: "8 min · rider 16 str / skripta 6 str" },
      { label: "Religija, država i demokratija (Drisen)", time: "10 min · rider 26 str / skripta 8 str" },
      { label: "Prodromou — ambivalentnost pravoslavlja", time: "3 min · rider 14 str / skripta 3 str" },
      { label: "Elštajn — religija i demokratija", time: "4 min · rider 13 str / skripta 3 str" },
      { label: "Hrišćanstvo i demokratija (Berger)", time: "6 min · rider 5 str / skripta 5 str" }
    ],
    after: [
      { kind: "pauza", label: "🚿 pauza za tuširanje", time: "20 min · 02:31–02:51" }
    ]
  },
  {
    title: "Blok 3 — Pitanja 1–18 iz skripte",
    time: "02:51–03:20 · 29 min",
    endTime: "03:20",
    type: "range",
    from: 1, to: 18,
    after: [
      { kind: "pauza", label: "pauza", time: "5 min · 03:20–03:25" }
    ]
  },
  {
    title: "Blok 4 — Pitanja 69–95 iz skripte",
    time: "03:25–05:53 · 2h 28min",
    endTime: "05:53",
    type: "range",
    from: 69, to: 95,
    after: [
      { kind: "pauza", label: "pauza", time: "5 min · 05:53–05:58" }
    ]
  },
  {
    title: "Blok 5 — Sve SKRIPTA SKRIPTE",
    time: "05:58–06:26 · 28 min",
    endTime: "06:26",
    type: "items",
    items: [
      { label: "Pitanja 1–18 (kondenzovano)", time: "" },
      { label: "Pitanja 69–95 (kondenzovano)", time: "" },
      { label: "Pitanja 96–114 (kondenzovano)", time: "" }
    ],
    after: [
      { kind: "pauza", label: "pauza", time: "5 min · 06:26–06:31" }
    ]
  },
  {
    title: "Finalni pregled — sve u kratkim crtama",
    time: "06:31–08:19 · 1h 48min",
    endTime: "08:19",
    type: "items",
    items: [
      { label: "96–114 — najvažnija, dobijaju najviše vremena", time: "57 min · 06:31–07:28" },
      { label: "69–95 — brzi refresh", time: "27 min · 07:28–07:55" },
      { label: "1–18 — brzi refresh", time: "24 min · 07:55–08:19" }
    ]
  },
  {
    title: "🕘 Bafer do ispita",
    time: "08:19–09:00 · 41 min",
    type: "items",
    items: [
      { label: "Put, poslednji pogled, disanje", time: "41 min" }
    ]
  }
];

let state = {};
let actualTimes = {};
let actualItemMinutes = {}; // "b{bi}-i{ii}" -> broj (stvarno utrošenih minuta na tu stavku

function parsePlannedMinutes(timeStr){
  if(!timeStr) return null;
  const match = timeStr.match(/(\d+)\s*min/);
  return match ? parseInt(match[1], 10) : null;
}

function itemDiffInfo(plannedMin, actualMin){
  if(actualMin === null || actualMin === undefined || actualMin === '') return null;
  const diff = actualMin - plannedMin;
  if(diff === 0) return { text: "tačno", cls: "ontime" };
  if(diff > 0) return { text: `+${diff} min`, cls: "late" };
  return { text: `${diff} min`, cls: "early" };
}

function updateItemActual(key, value){
  if(value !== '' && value !== null){
    actualItemMinutes[key] = parseInt(value, 10);
  } else {
    delete actualItemMinutes[key];
  }
  render();
}

let actualPauseMinutes = {}; // "b{bi}-after{ai}" -> broj (stvarno trajanje pauze)

function updatePauseActual(key, value){
  if(value !== '' && value !== null){
    actualPauseMinutes[key] = parseInt(value, 10);
  } else {
    delete actualPauseMinutes[key];
  }
  render();
}

let actualMicrobreakMinutes = {}; // "b{bi}-mb{ii}" -> broj (stvarno trajanje mikropauze)

function updateMicrobreakActual(key, value){
  if(value !== '' && value !== null){
    actualMicrobreakMinutes[key] = parseInt(value, 10);
  } else {
    delete actualMicrobreakMinutes[key];
  }
  render();
}

function timeToMinutes(t){
  if(!t) return null;
  const [hh, mm] = t.split(':').map(Number);
  return hh * 60 + mm;
}

function diffInfo(targetStr, actualStr){
  const target = timeToMinutes(targetStr);
  const actual = timeToMinutes(actualStr);
  if(actual === null) return null;
  const diff = actual - target;
  if(diff === 0) return { text: "tačno na vreme", cls: "ontime" };
  if(diff > 0) return { text: `+${diff} min kasni`, cls: "late" };
  return { text: `${diff} min ispred`, cls: "early" };
}

function updateActual(bi, value){
  if(value){
    actualTimes[bi] = value;
  } else {
    delete actualTimes[bi];
  }
  render();
}

function updateStatusLine(){
  const el = document.getElementById('statusLine');
  // nađi poslednji (po redosledu blokova) uneti actual time
  let lastIdx = -1;
  blocks.forEach((b, bi) => { if(b.endTime && actualTimes[bi]) lastIdx = bi; });

  if(lastIdx === -1){
    el.innerHTML = "";
    return;
  }

  const b = blocks[lastIdx];
  const info = diffInfo(b.endTime, actualTimes[lastIdx]);
  if(!info){ return; }
  el.innerHTML = `Trenutni status (posle "${b.title.split('—')[0].trim()}"): <span class="${info.cls}">${info.text}</span>`;
}

// Countdown do 09:00 (ispit) — start 25.8. 20:00, kraj 26.8. 09:00
const examTime = new Date(2026, 7, 26, 9, 0, 0); // mesec je 0-indeksiran: 7 = avgust

function updateCountdown(){
  const now = new Date();
  let diff = examTime - now;
  const el = document.getElementById('countdownDisplay');

  if(diff <= 0){
    el.textContent = "Ispit je počeo";
    el.classList.add('warn');
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  if(h < 1) el.classList.add('warn');
}

updateCountdown();
setInterval(updateCountdown, 1000);

function totalCheckable(){
  let total = 0;
  blocks.forEach((b, bi) => {
    if(b.type === "range"){
      total += (b.to - b.from + 1);
    } else {
      total += b.items.length;
      if(b.microbreak) total += Math.max(0, b.items.length - 1);
    }
    if(b.after) total += b.after.length;
  });
  return total;
}

function render(){
  const container = document.getElementById('blocks');
  container.innerHTML = '';

  blocks.forEach((b, bi) => {
    const blockEl = document.createElement('div');
    blockEl.className = 'block';

    let checkedCount = 0;
    let denom = 0;

    if(b.type === "range"){
      denom = b.to - b.from + 1;
      for(let n = b.from; n <= b.to; n++){
        if(state[`b${bi}-n${n}`]) checkedCount++;
      }
    } else {
      denom = b.items.length;
      b.items.forEach((_, ii) => { if(state[`b${bi}-i${ii}`]) checkedCount++; });
    }

    const pct = denom ? Math.round((checkedCount / denom) * 100) : 0;

    const info = b.endTime ? diffInfo(b.endTime, actualTimes[bi]) : null;
    const actualRowHtml = b.endTime ? `
      <div class="actual-row">
        <span>Stvarno završeno:</span>
        <input type="time" value="${actualTimes[bi] || ''}" data-bi="${bi}" class="actual-input">
        ${info ? `<span class="diff-badge ${info.cls}">${info.text}</span>` : ''}
      </div>
    ` : '';

    blockEl.innerHTML = `
      <div class="block-head">
        <div class="block-title">${b.title}</div>
        <div class="block-time">${b.time}</div>
      </div>
      <div class="block-progress">${checkedCount} / ${denom} završeno</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      ${actualRowHtml}
    `;

    if(b.type === "range"){
      const grid = document.createElement('div');
      grid.className = 'grid';
      for(let n = b.from; n <= b.to; n++){
        const key = `b${bi}-n${n}`;
        const item = document.createElement('div');
        item.className = 'item' + (state[key] ? ' checked' : '');
        item.textContent = n;
        item.onclick = () => { state[key] = !state[key]; render(); };
        grid.appendChild(item);
      }
      blockEl.appendChild(grid);
    } else {
      const list = document.createElement('div');
      list.className = 'list';
      b.items.forEach((it, ii) => {
        const key = `b${bi}-i${ii}`;
        const row = document.createElement('div');
        row.className = 'row' + (state[key] ? ' checked' : '');
        row.innerHTML = `<span class="row-label">${it.label}</span>` +
          (it.time ? `<span class="row-time">${it.time}</span>` : '');
        row.onclick = () => { state[key] = !state[key]; render(); };
        list.appendChild(row);

        const planned = parsePlannedMinutes(it.time);
        if(planned !== null){
          const itemInfo = itemDiffInfo(planned, actualItemMinutes[key]);
          const itemRow = document.createElement('div');
          itemRow.className = 'item-actual-row';
          itemRow.innerHTML = `
            <span>Stvarno (plan ${planned} min):</span>
            <input type="number" min="0" placeholder="${planned}" value="${actualItemMinutes[key] !== undefined ? actualItemMinutes[key] : ''}">
            ${itemInfo ? `<span class="diff-badge ${itemInfo.cls}">${itemInfo.text}</span>` : ''}
          `;
          const inp = itemRow.querySelector('input');
          inp.onclick = (e) => e.stopPropagation();
          inp.onchange = (e) => { e.stopPropagation(); updateItemActual(key, e.target.value); };
          list.appendChild(itemRow);
        }

        if(b.microbreak && ii < b.items.length - 1){
          const mbKey = `b${bi}-mb${ii}`;
          const mb = document.createElement('div');
          mb.className = 'microbreak' + (state[mbKey] ? ' checked' : '');
          mb.innerHTML = `<span>pauza ${b.microbreak}</span>`;
          mb.onclick = () => { state[mbKey] = !state[mbKey]; render(); };
          list.appendChild(mb);

          const plannedMb = parsePlannedMinutes(b.microbreak);
          if(plannedMb !== null){
            const mbInfo = itemDiffInfo(plannedMb, actualMicrobreakMinutes[mbKey]);
            const mbRow = document.createElement('div');
            mbRow.className = 'item-actual-row';
            mbRow.style.marginLeft = '22px';
            mbRow.innerHTML = `
              <span>Stvarno (plan ${plannedMb} min):</span>
              <input type="number" min="0" placeholder="${plannedMb}" value="${actualMicrobreakMinutes[mbKey] !== undefined ? actualMicrobreakMinutes[mbKey] : ''}">
              ${mbInfo ? `<span class="diff-badge ${mbInfo.cls}">${mbInfo.text}</span>` : ''}
            `;
            const mbInp = mbRow.querySelector('input');
            mbInp.onclick = (e) => e.stopPropagation();
            mbInp.onchange = (e) => { e.stopPropagation(); updateMicrobreakActual(mbKey, e.target.value); };
            list.appendChild(mbRow);
          }
        }
      });
      blockEl.appendChild(list);
    }

    container.appendChild(blockEl);

    if(b.endTime){
      const input = blockEl.querySelector('.actual-input');
      if(input){
        input.onchange = (e) => updateActual(bi, e.target.value);
      }
    }

    if(b.after){
      b.after.forEach((a, ai) => {
        const key = `b${bi}-after${ai}`;
        const pause = document.createElement('div');
        pause.className = 'pause' + (a.kind === 'provera' ? ' provera' : '') + (state[key] ? ' checked' : '');
        pause.innerHTML = `<span>${a.label}${a.time ? ' · ' + a.time : ''}</span>`;
        pause.onclick = () => { state[key] = !state[key]; render(); };
        container.appendChild(pause);

        const plannedPause = parsePlannedMinutes(a.time);
        if(plannedPause !== null){
          const pauseInfo = itemDiffInfo(plannedPause, actualPauseMinutes[key]);
          const pauseRow = document.createElement('div');
          pauseRow.className = 'pause-actual-row';
          pauseRow.innerHTML = `
            <span>Stvarno (plan ${plannedPause} min):</span>
            <input type="number" min="0" placeholder="${plannedPause}" value="${actualPauseMinutes[key] !== undefined ? actualPauseMinutes[key] : ''}">
            ${pauseInfo ? `<span class="diff-badge ${pauseInfo.cls}">${pauseInfo.text}</span>` : ''}
          `;
          const pinp = pauseRow.querySelector('input');
          pinp.onclick = (e) => e.stopPropagation();
          pinp.onchange = (e) => { e.stopPropagation(); updatePauseActual(key, e.target.value); };
          container.appendChild(pauseRow);
        }
      });
    }
  });

  const totalChecked = Object.values(state).filter(Boolean).length;
  document.getElementById('overallCount').textContent = `${totalChecked} / ${totalCheckable()}`;
  updateStatusLine();
}

function resetAll(){
  state = {};
  actualTimes = {};
  actualItemMinutes = {};
  actualPauseMinutes = {};
  actualMicrobreakMinutes = {};
  render();
}

render();
</script>

</body>
